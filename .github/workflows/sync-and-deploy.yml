name: Sync blog to Gemini

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "manifest.json"
      - "blog/**"
      - "dist/**"

concurrency:
  group: gemini-blog-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-blog:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Seed blog directory from the existing mirror
        run: |
          if [ ! -d blog ]; then
            mkdir blog
            cp -a dist/. blog/
          fi

      - name: Generate Gemtext
        run: >-
          cargo run --release -p cli --
          --feed-url https://blog.willgrant.org/feed.xml
          --manifest manifest.json
          --out blog
          --url-prefix /blog
          --force
          --site-title "Blog posts by Will Grant (Gemini mirror)"

      - name: Commit generated content and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json blog/
          if ! git diff --cached --quiet; then
            git commit -m "Update generated Gemini blog"
            git push
          fi

# Fly.io watches main and builds/deploys after the generated commit is pushed.
# End of workflow.

