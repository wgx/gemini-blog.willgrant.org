[package]
name = "cli"
version = "0.1.0"
edition = "2021"
description = "Ingests a blog's RSS/Atom feed and incrementally generates a Gemtext (.gmi) mirror."

[[bin]]
name = "cli"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
feed-rs = "2"
scraper = "0.20"
ego-tree = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
