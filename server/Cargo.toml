[package]
name = "server"
version = "0.1.0"
edition = "2021"
description = "Minimal async Gemini protocol server that serves pre-built .gmi files from disk."

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "fs", "signal"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
rcgen = "0.13"
url = "2"
anyhow = "1"
percent-encoding = "2"
